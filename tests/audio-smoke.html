<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill sound review</title>
<style>body{background:#102024;color:#eee9dc;font:16px system-ui;margin:24px}button,select{font:inherit;padding:12px;background:#234146;color:white;border:1px solid #79b7ad}iframe{width:100%;height:360px;border:0}pre{white-space:pre-wrap}label{margin-right:12px}</style>
<h1>Skill sound review</h1><p>Original synthesized combat sounds. Run checks, or select a hero and skill to audition. The downloadable WAV contains all twelve ultimates.</p>
<button id="run" disabled>Run audio checks</button> <label>Hero <select id="hero"><option value="ustaz">Hakim</option><option value="rempit">Jet</option><option value="nok">Nok</option><option value="lan">Lan</option><option value="sari">Sari</option><option value="asha">Asha</option><option value="mira">Mira</option><option value="dani">Dani</option><option value="vanna">Vanna</option><option value="keo">Keo</option><option value="nadi">Nadi</option><option value="lia">Lia</option></select></label><label>Skill <select id="skill"><option value="0">Basic</option><option value="1">Q</option><option value="2">E</option><option value="3">F</option><option value="4">Ultimate</option></select></label><button id="play" disabled>Play sound</button> <a id="sample" download="ultimate-sounds.wav">Download ultimate sampler</a><button id="download">Download JSON report</button><pre id="report">Loading game…</pre><iframe id="game" title="Audio game under test" src="../index.html"></iframe>
<script type="module">
import {SKILL_SOUNDS,renderSkill} from '../src/game/skill-audio.js';
const $=id=>document.getElementById(id),frame=$('game');let rt;
const ready=setInterval(()=>{rt=frame.contentWindow.__asean;if(rt){clearInterval(ready);$('run').disabled=$('play').disabled=false;$('report').textContent='Ready.'}},100);
$('play').onclick=async()=>{await rt.audio.unlock();rt.audio.setVolume(.6);rt.audio.setMuted(false);rt.toMenu();await rt.scene.prepareHero($('hero').value);rt.newGame($('hero').value,0);frame.contentDocument.getElementById('menu').hidden=true;rt.G.auto=false;rt.G.cds[0]=999;rt.G.spawnT=rt.G.durianT=999;rt.G.ult=rt.G.hero.ultNeed;const slot=Number($('skill').value);if(slot)rt.tryCast(slot);else rt.audio.play($('hero').value,0);};
// Failure scope: missing/identical/clipped buffers, locked audio, rejected casts making sounds,
// stale tails after pause/menu, mute leakage, and unbounded simultaneous voices.
$('run').onclick=async()=>{
const checks=[],check=(name,pass)=>{checks.push({name,pass:!!pass});if(!pass)throw Error(name)};
const old={volume:rt.audio.volume,muted:rt.audio.muted};let result='PASS',error;
try{
await rt.audio.unlock();check('User gesture unlocks Web Audio',rt.audio.context?.state==='running');rt.audio.setMuted(false);rt.audio.setVolume(.6);
const hashes=new Set();for(const key of Object.keys(SKILL_SOUNDS)){const pcm=renderSkill(key,22050);let peak=0,energy=0,hash=0;for(let i=0;i<pcm.length;i++){checkFinite(pcm[i]);peak=Math.max(peak,Math.abs(pcm[i]));energy+=pcm[i]*pcm[i];hash=(hash*31+Math.round(pcm[i]*32767))|0}check(key+' produces finite audible unclipped audio',peak>.02&&peak<=.86&&energy/pcm.length>.00001);hashes.add(hash)}check('All 60 cues have distinct waveforms',hashes.size===60);
for(const hero of ['ustaz','rempit','nok','lan','sari','asha','mira','dani','vanna','keo','nadi','lia'])for(let slot=1;slot<5;slot++){
rt.toMenu();await rt.scene.prepareHero(hero);rt.newGame(hero,0);const g=rt.G;g.auto=false;g.cds[0]=999;g.spawnT=g.durianT=999;g.ult=g.hero.ultNeed;rt.tryCast(slot);check(hero+' '+slot+' successful cast plays matching sound',rt.audio.lastCue===hero+'-'+slot&&rt.audio.voices.size>0);
const before=rt.audio.playCount;rt.tryCast(slot);check(hero+' '+slot+' rejected cast stays silent',rt.audio.playCount===before);
rt.togglePause();check(hero+' '+slot+' pause clears sound tails',rt.audio.voices.size===0);
}
rt.audio.setPaused(false);rt.audio.setMuted(true);const before=rt.audio.playCount;rt.audio.play('lan',4);check('Mute prevents new sound',rt.audio.playCount===before&&rt.audio.voices.size===0);rt.audio.setMuted(false);
rt.audio.play('ustaz',4);const ultimate=[...rt.audio.voices.keys()][0];for(const hero of ['ustaz','rempit','nok','lan','sari','asha','mira','dani','vanna','keo','nadi','lia'])for(let slot=0;slot<4;slot++)rt.audio.play(hero,slot);check('Concurrent sounds are bounded',rt.audio.voices.size===8);check('Ultimate survives ordinary voice stealing',rt.audio.voices.has(ultimate));
rt.toMenu();check('Returning to menu clears voices',rt.audio.voices.size===0);
await rt.scene.prepareHero('ustaz');rt.newGame('ustaz',0);rt.audio.play('ustaz',1);rt.openLevelUp();check('Upgrade selection stops audio',rt.audio.voices.size===0);await rt.scene.prepareHero('ustaz');rt.newGame('ustaz',0);rt.audio.play('ustaz',1);rt.endGame(false);check('Defeat stops audio',rt.audio.voices.size===0);
rt.audio.setVolume(.35);check('Volume preference persists',JSON.parse(localStorage.getItem('aseanSurvivor.audio')).volume===.35);
rt.audio.setVolume(0);rt.audio.setPaused(false);rt.audio.play('nok',4);check('Zero volume stays silent',rt.audio.voices.size===0);
}catch(e){result='FAIL';error=e.message}finally{rt.toMenu();rt.audio.setVolume(old.volume);rt.audio.setMuted(old.muted);$('report').textContent=JSON.stringify({date:new Date().toISOString(),result,error,checks},null,2)}
};
$('download').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([$('report').textContent],{type:'application/json'}));a.href=url;a.download='audio-roster-'+Date.now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function checkFinite(v){if(!Number.isFinite(v))throw Error('Non-finite audio sample')}
const rate=22050,segments=['ustaz','rempit','nok','lan','sari','asha','mira','dani','vanna','keo','nadi','lia'].map(id=>renderSkill(id+'-4',rate));const count=segments.reduce((n,a)=>n+a.length+rate/2,0),wav=new ArrayBuffer(44+count*2),view=new DataView(wav);let offset=44;const text=(o,s)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i))};text(0,'RIFF');view.setUint32(4,wav.byteLength-8,true);text(8,'WAVEfmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,rate,true);view.setUint32(28,rate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);text(36,'data');view.setUint32(40,count*2,true);for(const pcm of segments){for(const v of pcm){view.setInt16(offset,Math.round(v*32767),true);offset+=2}offset+=rate}$('sample').href=URL.createObjectURL(new Blob([wav],{type:'audio/wav'}));
</script></html>
