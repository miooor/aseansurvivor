<!doctype html><html lang="en"><meta charset="utf-8"><title>Open region checks</title><style>body{background:#102024;color:#eee9dc;font:16px system-ui}iframe{width:100%;height:620px;border:0}pre{white-space:pre-wrap}</style><h1>Open region verification</h1><button id="run" disabled>Run map checks</button><select id="place" aria-label="Preview landmark"></select><button id="preview" disabled>Preview landmark</button><details><summary>Verification report</summary><pre id="report">Loading…</pre></details><iframe id="game" src="../index.html" title="Region under test"></iframe><script type="module">
import {LANDMARKS,BLOCKERS,walkable,moveOnMap,safePoint,routeDirection,WORLD_SIZE} from '../src/content/world.js';
const frame=document.querySelector('#game'),report=document.querySelector('#report');let rt;const timer=setInterval(()=>{rt=frame.contentWindow.__asean;if(rt){clearInterval(timer);document.querySelector('#run').disabled=document.querySelector('#preview').disabled=false;report.textContent='Ready'}},100);
const select=document.querySelector('#place');for(const site of LANDMARKS){const option=document.createElement('option');option.value=site.id;option.textContent=site.name;select.append(option)}
document.querySelector('#preview').onclick=()=>{rt.toMenu();rt.newGame('ustaz',0);frame.contentDocument.getElementById('menu').hidden=true;const s=LANDMARKS.find(s=>s.id===select.value);Object.assign(rt.G.p,{x:s.id==='river'?s.x-420:s.x,y:s.y});rt.G.auto=false;rt.G.cds[0]=999;rt.G.spawnT=rt.G.durianT=999;rt.scene.update(0,50);rt.G.paused=true;};
// Failure scope: disconnected landmarks, wall tunneling, blocked spawns/rewards/portals,
// repeated rewards, stale exploration after retry, and map rules leaking into raids.
document.querySelector('#run').onclick=()=>{const checks=[],check=(name,pass)=>{checks.push({name,pass:!!pass});if(!pass)throw Error(name)};let result='PASS',error;
try{rt.toMenu();rt.newGame('ustaz',0);const g=rt.G;g.auto=false;g.cds[0]=999;g.spawnT=g.durianT=999;
check('Region is 6000 units across',WORLD_SIZE===6000);check('Camera reveals more world',rt.scale<1);check('Five distinct landmarks',LANDMARKS.length===5);
for(const site of LANDMARKS){check(site.name+' is reachable ground',walkable(site.x,site.y,30));const actor={x:0,y:0,r:24};for(let i=0;i<2500&&Math.hypot(actor.x-site.x,actor.y-site.y)>100;i++){const [dx,dy]=routeDirection(actor,site);Object.assign(actor,moveOnMap(actor.x,actor.y,actor.x+dx*30,actor.y+dy*30,actor.r))}check(site.name+' has a navigable route',Math.hypot(actor.x-site.x,actor.y-site.y)<=100)}
for(const b of BLOCKERS){const start=safePoint(b.x-100,b.y-100,24),end=moveOnMap(start.x,start.y,b.x+b.w/2,b.y+b.h/2,24);check('Collision '+b.id+' prevents tunneling',walkable(end.x,end.y,24))}
g.p.x=2100;g.p.y=1300;rt.scene.update(0,50);check('Old arena boundary is gone',g.p.x>1300);check('Exploration discovers market',g.exploration.visited.includes('market'));
const site=LANDMARKS.find(s=>s.id==='market');for(const enemy of g.enemies)enemy.dead=true;const before=g.coins;for(let i=0;i<5;i++)rt.scene.update(0,50);check('Cleared cache grants reward once',g.coins===before+site.reward);const earned=g.coins;for(let i=0;i<10;i++)rt.scene.update(0,50);check('Cache cannot be farmed repeatedly',g.coins===earned);
for(let i=0;i<80;i++){const e=rt.makeGhost('pocong',1300+i*3,-400+i*10);check('Spawn '+i+' lands on walkable ground',walkable(e.x,e.y,e.r))}
rt.raid.spawnPortal();check('Rift stays near explorer and on land',walkable(rt.raid.state.portal.x,rt.raid.state.portal.y,35)&&Math.hypot(rt.raid.state.portal.x-g.p.x,rt.raid.state.portal.y-g.p.y)<800);
rt.newGame('ustaz',0);check('Retry resets exploration rewards',rt.G.exploration.claimed.length===0);rt.raid.enter();rt.scene.update(0,50);check('Raid retains its separate arena',rt.G.p.x>50000);
}catch(e){result='FAIL';error=e.message}finally{rt.toMenu();report.textContent=JSON.stringify({date:new Date().toISOString(),result,error,checks},null,2)}};
</script></html>
