<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Combat effects review</title>
<style>body{margin:0;background:#102024;color:#eee9dc;font:14px system-ui}header{padding:16px 24px}h1{font:24px Georgia;margin:0 0 12px}button,select{padding:9px;background:#234146;color:#fff;border:1px solid #79b7ad;font:inherit}iframe{display:block;width:100%;height:calc(100vh - 140px);border:0}p{color:#bfd1c9;margin:8px 0}</style>
<header><h1>Combat effects review</h1><select id="hero" aria-label="Hero"><option value="ustaz">Hakim</option><option value="rempit">Jet</option><option value="nok">Nok</option><option value="lan">Lan</option><option value="sari">Sari</option><option value="asha">Asha</option><option value="mira">Mira</option><option value="dani">Dani</option><option value="vanna">Vanna</option><option value="keo">Keo</option><option value="nadi">Nadi</option><option value="lia">Lia</option></select> <select id="skill" aria-label="Skill"><option value="1">Q</option><option value="2">E</option><option value="3">F</option><option value="4">Ultimate</option></select> <select id="moment" aria-label="Moment"><option value="5">Cast pose (0.25s)</option><option value="12">Impact (0.6s)</option><option value="24">Sustain (1.2s)</option></select> <button id="cast" disabled>Preview skill + critical hits</button> <button id="freeze" disabled>Freeze frame</button><p>Development-only staging using real combat rules. Choose a hero and skill, then freeze the effect to inspect it.</p></header><iframe id="game" title="Combat preview" src="../index.html"></iframe>
<script type="module">
const frame=document.querySelector('#game'),cast=document.querySelector('#cast'),freeze=document.querySelector('#freeze');let rt;
const ready=setInterval(()=>{rt=frame.contentWindow.__asean;if(rt){clearInterval(ready);cast.disabled=freeze.disabled=false}},100);
cast.onclick=async ()=>{const w=frame.contentWindow,d=w.document;rt.toMenu();await rt.scene.prepareHero(document.querySelector('#hero').value);rt.newGame(document.querySelector('#hero').value,0);d.getElementById('menu').hidden=true;
const g=rt.G;g.auto=false;g.cds[0]=999;g.spawnT=g.durianT=999;g.st.crit=1;g.p.hp=g.p.maxHp-30;g.ult=g.hero.ultNeed;
for(let k=0;k<5;k++){const e=rt.makeGhost('pocong',60+k*24,(k-2)*20);e.hp=e.maxHp=9999;e.spd=0;e.stun=999}
d.getElementById('game').dispatchEvent(new w.MouseEvent('mousemove',{clientX:w.innerWidth/2+100,clientY:w.innerHeight/2}));cast.focus();g.paused=false;d.getElementById('pause').hidden=true;rt.tryCast(Number(document.querySelector('#skill').value));for(let n=0;n<Number(document.querySelector('#moment').value);n++)rt.scene.update(0,50);g.paused=true;freeze.textContent='Resume';};
freeze.onclick=()=>{if(!rt.G)return;rt.G.paused=!rt.G.paused;frame.contentDocument.getElementById('pause').hidden=true;freeze.textContent=rt.G.paused?'Resume':'Freeze frame'};
</script></html>
