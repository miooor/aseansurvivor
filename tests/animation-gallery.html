<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero animation review</title>
<style>
body{margin:0;padding:32px;background:#102024;color:#eee9dc;font:16px system-ui}h1{font:32px Georgia}button,select{font:inherit;padding:10px;background:#234146;color:#fff;border:1px solid #8fbdb2;border-radius:4px}label{margin-right:20px}.roster{display:flex;flex-wrap:wrap;gap:20px;margin-top:30px}.card{background:#183035;border:1px solid #44605d;padding:18px;text-align:center}.actor{height:192px;width:192px;background-size:800% 800%;background-repeat:no-repeat}p{color:#b4cbc4;max-width:75ch;line-height:1.6}output{display:block;margin:24px 0}
</style>
<h1>Hero animation review</h1><p>Twelve heroes · eight directions · movement, basic attacks, and unique Q/E/F/R poses. This review uses the same sprite sheets as the game. Change facing, pause, or step through individual frames to inspect silhouettes and alignment.</p>
<label>Facing <select id="direction"><option>E</option><option>SE</option><option>S</option><option>SW</option><option>W</option><option>NW</option><option>N</option><option>NE</option></select></label>
<label>Cycle <select id="cycle"><option value="0">Walk / ride</option><option value="4">Basic attack</option><option value="s0">Q</option><option value="s2">E</option><option value="s4">F</option><option value="s6">Ultimate</option></select></label><button id="pause">Pause</button> <button id="step">Next frame</button>
<div class="roster" id="roster"></div><output id="frame"></output>
<script type="module">
import {heroArt} from '../src/content/hero-art.js';
const names={ustaz:'Hakim',rempit:'Jet',nok:'Nok',lan:'Lan',sari:'Sari',asha:'Asha',mira:'Mira',dani:'Dani',vanna:'Vanna',keo:'Keo',nadi:'Nadi',lia:'Lia'};
const roster=document.querySelector('#roster'),direction=document.querySelector('#direction'),cycle=document.querySelector('#cycle'),pause=document.querySelector('#pause');
const images=new Map(),actors=[];
for(const [id,name]of Object.entries(names)){const card=document.createElement('section');card.className='card';card.innerHTML=`<h2>${name}</h2><canvas class="actor" width="192" height="192" role="img" aria-label="${name} animation"></canvas>`;roster.append(card);actors.push({id,canvas:card.querySelector('canvas')})}
let frame=0,playing=true;
function count(){return cycle.value.startsWith('s')?2:4}
function draw(){for(const {id,canvas}of actors){const art=heroArt[id],skill=cycle.value.startsWith('s'),kind=skill?'skills':'motion',row=Number(skill?cycle.value.slice(1):cycle.value)+frame,col=direction.selectedIndex,key=id+kind;let image=images.get(key);if(!image){image=new Image();image.onload=draw;image.src=art[kind];images.set(key,image)}if(!image.complete||!image.naturalWidth)continue;const measured=art.frames?.[kind][row*8+col],edges=skill?null:art.rows,x=measured?.x??Math.round(col*image.width/8),y=measured?.y??Math.round((edges?.[row]??row/8)*image.height),w=measured?.w??Math.round((col+1)*image.width/8)-x,h=measured?.h??Math.round((edges?.[row+1]??(row+1)/8)*image.height)-y,scale=176/(image.width/8),pivotX=measured?.pivotX??.5,pivotY=measured?.pivotY??art.originY,context=canvas.getContext('2d');context.clearRect(0,0,192,192);context.drawImage(image,x,y,w,h,96-w*scale*pivotX,184-h*scale*pivotY,w*scale,h*scale);}document.querySelector('#frame').textContent=`${direction.value} · ${cycle.selectedOptions[0].textContent} · frame ${frame+1} / ${count()}`}
pause.onclick=()=>{playing=!playing;pause.textContent=playing?'Pause':'Play'};
document.querySelector('#step').onclick=()=>{playing=false;pause.textContent='Play';frame=(frame+1)%count();draw()};direction.onchange=draw;cycle.onchange=()=>{frame=0;draw()};setInterval(()=>{if(playing){frame=(frame+1)%count();draw()}},140);draw();
</script></html>
