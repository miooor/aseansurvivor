<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero animation review</title>
<style>
body{margin:0;padding:32px;background:#102024;color:#eee9dc;font:16px system-ui}h1{font:32px Georgia}button,select{font:inherit;padding:10px;background:#234146;color:#fff;border:1px solid #8fbdb2;border-radius:4px}label{margin-right:20px}.roster{display:flex;flex-wrap:wrap;gap:20px;margin-top:30px}.card{background:#183035;border:1px solid #44605d;padding:18px;text-align:center}.actor{margin:auto;aspect-ratio:320/192;width:min(320px,78vw);background-size:800% 800%;background-repeat:no-repeat}p{color:#b4cbc4;max-width:75ch;line-height:1.6}output{display:block;margin:24px 0}
</style>
<h1>Hero animation review</h1><p>Twelve heroes · eight directions · movement, basic attacks, and unique Q/E/F/R poses. This review uses the same sprite sheets as the game. Change facing, pause, or step through individual frames to inspect silhouettes and alignment.</p>
<label>Facing <select id="direction"><option>E</option><option>SE</option><option>S</option><option>SW</option><option>W</option><option>NW</option><option>N</option><option>NE</option></select></label>
<label>Cycle <select id="cycle"><option value="idle">Idle</option><option value="0" selected>Walk / ride</option><option value="4">Basic attack</option><option value="s0">Q</option><option value="s2">E</option><option value="s4">F</option><option value="s6">Ultimate</option></select></label><button id="pause">Pause</button> <button id="step">Next frame</button>
<div class="roster" id="roster"></div><output id="frame"></output>
<script type="module">
import {heroArt} from '../src/content/hero-art.js';
const heroes=['ustaz','rempit','nok','lan','sari','asha','mira','dani','vanna','keo','nadi','lia'],names=['Fadli','Kama','Nok','Lan','Sari','Asha','Mira','Dani','Vanna','Keo','Nadi','Lia Soares'];
const roster=document.querySelector('#roster'),direction=document.querySelector('#direction'),cycle=document.querySelector('#cycle'),pause=document.querySelector('#pause');
for(const [i,id]of heroes.entries()){const card=document.createElement('section');card.className='card';card.innerHTML=`<h2>${names[i]}</h2><div class="actor" role="img" aria-label="${names[i]} animation" style="background-image:url('${heroArt[id].motion}')"></div>`;roster.append(card)}
let frame=0,playing=true;
function count(){return cycle.value==='idle'?1:cycle.value.startsWith('s')?2:4}
function draw(){
  const skill=cycle.value.startsWith('s');
  const row=cycle.value==='idle'?7:Number(skill?cycle.value.slice(1):cycle.value)+frame;
  for(const [index,actor] of document.querySelectorAll('.actor').entries()){
    actor.style.backgroundImage=`url('${heroArt[heroes[index]][skill?'skills':'motion']}')`;
    actor.style.backgroundPosition=`${direction.selectedIndex/7*100}% ${row/7*100}%`;
  }
  document.querySelector('#frame').textContent=`${direction.value} · ${cycle.selectedOptions[0].textContent} · frame ${frame+1} / ${count()}`;
}
pause.onclick=()=>{playing=!playing;pause.textContent=playing?'Pause':'Play'};
document.querySelector('#step').onclick=()=>{playing=false;pause.textContent='Play';frame=(frame+1)%count();draw()};direction.onchange=draw;cycle.onchange=()=>{frame=0;draw()};setInterval(()=>{if(playing){frame=(frame+1)%count();draw()}},140);draw();
</script></html>
